<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fish AR</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

<style>
  :root { --ink:#06232e; --foam:#eaf6f8; --tide:#1fb6c9; --coral:#ff7a59; }
  * { box-sizing:border-box; }
  html, body {
    margin:0; height:100%; overflow:hidden; background:var(--ink);
    touch-action:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  body { font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; }

  #cam { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; background:#000; }
  a-scene { position:fixed !important; inset:0; z-index:1; touch-action:none; }
  a-scene canvas { touch-action:none !important; }
  .a-enter-vr, .a-enter-ar, .a-orientation-modal { display:none !important; }

  #intro {
    position:fixed; inset:0; z-index:30;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    gap:22px; padding:32px; text-align:center;
    background:radial-gradient(120% 90% at 50% 0%, #0d3a4a 0%, var(--ink) 70%);
    color:var(--foam);
  }
  #intro h1 { margin:0; font-size:30px; letter-spacing:-.02em; }
  #intro p { margin:0; font-size:15px; line-height:1.7; opacity:.8; max-width:320px; }
  #start {
    border:0; border-radius:999px; padding:15px 38px;
    background:var(--tide); color:#04222b; font-size:16px; font-weight:700;
    font-family:inherit; cursor:pointer;
  }
  #start:focus-visible { outline:3px solid var(--coral); outline-offset:3px; }
  #err { color:var(--coral); font-size:14px; display:none; }

  #hint {
    position:fixed; top:calc(16px + env(safe-area-inset-top)); left:50%;
    transform:translateX(-50%); z-index:20; opacity:0; pointer-events:none;
    padding:10px 18px; border-radius:999px; font-size:13px; line-height:1.5;
    background:rgba(6,35,46,.66); color:var(--foam); text-align:center;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    transition:opacity .5s;
  }
  #hint.on { opacity:1; }

  #hud {
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    display:none; justify-content:center; align-items:center; gap:10px;
    padding:14px 14px calc(14px + env(safe-area-inset-bottom));
  }
  #hud.on { display:flex; }
  .btn {
    width:54px; height:54px; border:0; border-radius:50%;
    background:rgba(6,35,46,.62); color:var(--foam);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    font-size:22px; font-weight:600; font-family:inherit; cursor:pointer;
    touch-action:manipulation;
  }
  .btn:active { background:var(--tide); color:#04222b; }
  #scaleLabel {
    min-width:74px; text-align:center; padding:12px 0; border-radius:999px;
    background:rgba(6,35,46,.62); color:var(--foam); font-size:14px;
    font-variant-numeric:tabular-nums;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
</style>
</head>
<body>

<video id="cam" autoplay playsinline muted></video>

<div id="intro">
  <h1>물 속 세상으로 떠나요!</h1>
  <p>카메라를 켜고 휴대폰을 천천히 돌리면 주변에 물고기가 헤엄치고 있습니다. AR 기술로 물 속 세상을 경험해 보세요!</p>
  <button id="start">지금 시작!!!</button>
  <p id="err"></p>
</div>

<div id="hint">물고기를 끌어서 옮기고<br>두 손가락으로 크기를 바꿔보세요</div>

<div id="hud">
  <button class="btn" id="minus" aria-label="작게">−</button>
  <div id="scaleLabel">100%</div>
  <button class="btn" id="plus" aria-label="크게">+</button>
  <button class="btn" id="reset" aria-label="처음 상태로">↺</button>
</div>

<script>
/* =========================================================
   1. fit-size — GLB 원본 단위가 제각각이어도 같은 크기로 맞춤
   ========================================================= */
AFRAME.registerComponent('fit-size', {
  schema: { size: {default: 0.4} },   // 물고기 최대 길이 (미터)
  init: function () {
    var self = this;
    this.el.addEventListener('model-loaded', function () {
      var o = self.el.object3D;
      o.scale.set(1, 1, 1);
      var box = new THREE.Box3().setFromObject(o);
      var s = new THREE.Vector3();
      box.getSize(s);
      var max = Math.max(s.x, s.y, s.z);
      // 원본이 얼마짜리든 목표 길이가 되도록 기준 배율을 계산
      self.el.dataset.base = (max > 0.0001) ? (self.data.size / max) : 1;
      applyScale();
    });
  }
});

/* =========================================================
   2. wander — 랜덤한 목적지를 정해 돌아다니는 유영
   ========================================================= */
AFRAME.registerComponent('wander', {
  schema: {
    speed:    {default: 0.5},   // 이동 속도 (m/s)
    turn:     {default: 1.2},   // 방향 전환의 민첩함
    rangeXZ:  {default: 3.5},   // 좌우·앞뒤로 돌아다니는 범위 (m)
    rangeY:   {default: 0.9},   // 위아래 범위 (m)
    minDist:  {default: 1.2},   // 내 몸에서 이 거리 안으로는 안 들어옴
    yawOffset:{default: 0}      // 모델이 옆·뒤를 보면 1.57 등으로 보정
  },
  init: function () {
    this.vel = new THREE.Vector3();
    this.target = new THREE.Vector3();
    this.tmp = new THREE.Vector3();
    this.t = Math.random() * 10;
    this.frozen = false;
    this.pickTarget();
    this.el.object3D.position.copy(this.target);   // 시작 위치도 랜덤
    this.pickTarget();
  },
  pickTarget: function () {
    var d = this.data, p = this.target;
    for (var i = 0; i < 16; i++) {
      p.set(
        (Math.random() * 2 - 1) * d.rangeXZ,
        (Math.random() * 2 - 1) * d.rangeY,
        (Math.random() * 2 - 1) * d.rangeXZ
      );
      if (Math.hypot(p.x, p.z) >= d.minDist) break;
    }
    this.timer = 4 + Math.random() * 6;   // 오래 못 가면 목적지 변경
  },
  tick: function (time, delta) {
    if (this.frozen || !delta) return;
    var dt = Math.min(delta / 1000, 0.05);
    var d = this.data, o = this.el.object3D;
    this.t += dt;
    this.timer -= dt;

    this.tmp.subVectors(this.target, o.position);
    if (this.tmp.length() < 0.4 || this.timer < 0) {
      this.pickTarget();
      this.tmp.subVectors(this.target, o.position);
    }
    this.tmp.normalize().multiplyScalar(d.speed);
    this.vel.lerp(this.tmp, Math.min(1, d.turn * dt));
    o.position.addScaledVector(this.vel, dt);

    var sp = this.vel.length();
    var yaw = Math.atan2(this.vel.x, this.vel.z) + d.yawOffset;
    var pitch = sp > 0.001 ? -Math.asin(Math.max(-1, Math.min(1, this.vel.y / sp))) * 0.6 : 0;
    o.rotation.set(pitch, yaw, Math.sin(this.t * 5) * 0.12);
  },
  freeze: function () { this.frozen = true; this.vel.set(0, 0, 0); },
  release: function () { this.pickTarget(); this.frozen = false; },
  restore: function () { this.init(); }
});

/* ===== 상태 ===== */
var camEl, school, fishEls = [], modelEls = [];
var scale = 1, MIN = 0.05, MAX = 8;
var raycaster, v2, tmpV;

function applyScale() {
  scale = Math.min(MAX, Math.max(MIN, scale));
  modelEls.forEach(function (el) {
    var b = parseFloat(el.dataset.base) || 1;
    el.object3D.scale.set(b * scale, b * scale, b * scale);
  });
  var label = document.getElementById('scaleLabel');
  if (label) label.textContent = Math.round(scale * 100) + '%';
}

function pickFish(x, y) {
  var cam = camEl && camEl.getObject3D('camera');
  if (!cam) return null;
  v2.set((x / window.innerWidth) * 2 - 1, -(y / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(v2, cam);
  var hits = raycaster.intersectObjects(fishEls.map(function (el) { return el.object3D; }), true);
  if (!hits.length) return null;
  var o = hits[0].object;
  while (o) {
    for (var i = 0; i < fishEls.length; i++) if (fishEls[i].object3D === o) return fishEls[i];
    o = o.parent;
  }
  return null;
}

/* ===== 터치 · 마우스 ===== */
var pointers = new Map();
var grabbed = null, grabDist = 2.5;
var lastX = 0, rotating = false;
var pinchStart = 0, pinchScale = 1;

function pinchDistance() {
  var p = Array.from(pointers.values());
  return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
}
function releaseGrab() {
  if (!grabbed) return;
  grabbed.components.wander.release();
  grabbed = null;
}

function onDown(e) {
  if (e.target.closest('#hud') || e.target.closest('#intro')) return;
  pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});

  if (pointers.size === 2) {
    releaseGrab();
    rotating = false;
    pinchStart = pinchDistance();
    pinchScale = scale;
    return;
  }
  if (pointers.size !== 1) return;

  var fish = pickFish(e.clientX, e.clientY);
  if (fish) {
    grabbed = fish;
    fish.components.wander.freeze();
    var camPos = new THREE.Vector3(), fishPos = new THREE.Vector3();
    camEl.object3D.getWorldPosition(camPos);
    fish.object3D.getWorldPosition(fishPos);
    grabDist = camPos.distanceTo(fishPos);
  } else {
    rotating = true;
    lastX = e.clientX;
  }
}

function onMove(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});

  if (pointers.size >= 2 && pinchStart > 0) {
    scale = pinchScale * (pinchDistance() / pinchStart);
    applyScale();
    return;
  }
  if (grabbed) {
    var cam = camEl.getObject3D('camera');
    v2.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
    raycaster.setFromCamera(v2, cam);
    tmpV.copy(raycaster.ray.direction).multiplyScalar(grabDist).add(raycaster.ray.origin);
    school.object3D.worldToLocal(tmpV);
    grabbed.object3D.position.copy(tmpV);
    return;
  }
  if (rotating) {
    school.object3D.rotation.y += (e.clientX - lastX) * 0.005;
    lastX = e.clientX;
  }
}

function onUp(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchStart = 0;
  if (pointers.size === 0) { releaseGrab(); rotating = false; }
}

/* ===== 카메라 · 자이로 ===== */
async function startCamera() {
  var stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' } }, audio: false
  });
  document.getElementById('cam').srcObject = stream;
}
async function askGyro() {
  var DOE = window.DeviceOrientationEvent;
  if (DOE && typeof DOE.requestPermission === 'function') {
    try { await DOE.requestPermission(); } catch (err) {}
  }
}

window.addEventListener('DOMContentLoaded', function () {
  raycaster = new THREE.Raycaster();
  v2 = new THREE.Vector2();
  tmpV = new THREE.Vector3();

  camEl    = document.getElementById('cam3d');
  school   = document.getElementById('school');
  fishEls  = Array.prototype.slice.call(document.querySelectorAll('.fish'));
  modelEls = Array.prototype.slice.call(document.querySelectorAll('.model'));
  applyScale();

  document.getElementById('plus').onclick  = function () { scale *= 1.25; applyScale(); };
  document.getElementById('minus').onclick = function () { scale /= 1.25; applyScale(); };
  document.getElementById('reset').onclick = function () {
    scale = 1; applyScale();
    school.object3D.rotation.y = 0;
    fishEls.forEach(function (el) { el.components.wander.restore(); });
  };

  document.addEventListener('pointerdown', onDown);
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);

  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); }, {passive: false});
  });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, {passive: false});

  document.getElementById('start').onclick = async function () {
    var err = document.getElementById('err');
    try {
      await askGyro();
      await startCamera();
      document.getElementById('intro').style.display = 'none';
      document.getElementById('hud').classList.add('on');
      var hint = document.getElementById('hint');
      hint.classList.add('on');
      setTimeout(function () { hint.classList.remove('on'); }, 4500);
    } catch (e2) {
      err.style.display = 'block';
      err.textContent = '카메라를 열지 못했습니다. 주소가 https로 시작하는지, 브라우저에서 카메라가 차단되지 않았는지 확인해 주세요.';
    }
  };
});
</script>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  renderer="colorManagement: true; antialias: true; alpha: true"
  background="transparent: true">

  <a-assets>
    <a-asset-item id="fish1" src="Fish1.glb"></a-asset-item>
    <a-asset-item id="fish2" src="Fish2.glb"></a-asset-item>
    <a-asset-item id="fish3" src="Fish3.glb"></a-asset-item>
  </a-assets>

  <a-entity id="cam3d" camera position="0 1.6 0"
            look-controls="touchEnabled: false; mouseEnabled: false; magicWindowTrackingEnabled: true"></a-entity>

  <a-entity id="school" position="0 1.6 0">

    <a-entity class="fish" wander="speed: 0.45; turn: 1.2; rangeXZ: 3.0; rangeY: 0.8">
      <a-entity class="model" gltf-model="#fish1" animation-mixer fit-size="size: 0.40"></a-entity>
      <a-sphere radius="0.4" material="opacity: 0; transparent: true; depthWrite: false"></a-sphere>
    </a-entity>

    <a-entity class="fish" wander="speed: 0.70; turn: 1.8; rangeXZ: 3.8; rangeY: 1.0">
      <a-entity class="model" gltf-model="#fish2" animation-mixer fit-size="size: 0.30"></a-entity>
      <a-sphere radius="0.4" material="opacity: 0; transparent: true; depthWrite: false"></a-sphere>
    </a-entity>

    <a-entity class="fish" wander="speed: 0.30; turn: 0.9; rangeXZ: 4.5; rangeY: 1.2">
      <a-entity class="model" gltf-model="#fish3" animation-mixer fit-size="size: 0.55"></a-entity>
      <a-sphere radius="0.4" material="opacity: 0; transparent: true; depthWrite: false"></a-sphere>
    </a-entity>

  </a-entity>

  <a-light type="ambient" color="#cfeff5" intensity="0.9"></a-light>
  <a-light type="directional" position="1 3 2" intensity="0.7"></a-light>
</a-scene>

</body>
</html>
