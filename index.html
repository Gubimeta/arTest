<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fish AR — 마커 없음</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

<style>
  :root { --ink:#06232e; --foam:#eaf6f8; --tide:#1fb6c9; --coral:#ff7a59; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--ink); }
  body { font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; }

  /* 카메라 영상 = 맨 뒤 배경 */
  #cam {
    position:fixed; inset:0; width:100%; height:100%;
    object-fit:cover; z-index:0; background:#000;
  }
  /* 3D 씬 = 그 위에 투명하게 겹침 */
  a-scene { position:fixed !important; inset:0; z-index:1; }
  .a-enter-vr, .a-enter-ar, .a-orientation-modal { display:none !important; }

  #intro {
    position:fixed; inset:0; z-index:30;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    gap:22px; padding:32px; text-align:center;
    background:radial-gradient(120% 90% at 50% 0%, #0d3a4a 0%, var(--ink) 70%);
    color:var(--foam);
  }
  #intro h1 { margin:0; font-size:30px; letter-spacing:-.02em; }
  #intro p { margin:0; font-size:15px; line-height:1.7; opacity:.8; max-width:320px; }
  #start {
    border:0; border-radius:999px; padding:15px 38px;
    background:var(--tide); color:#04222b; font-size:16px; font-weight:700;
    font-family:inherit; cursor:pointer;
  }
  #start:focus-visible { outline:3px solid var(--coral); outline-offset:3px; }
  #err { color:var(--coral); font-size:14px; display:none; }

  #hud {
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    display:none; justify-content:center; align-items:center; gap:10px;
    padding:14px 14px calc(14px + env(safe-area-inset-bottom));
  }
  #hud.on { display:flex; }
  .btn {
    width:54px; height:54px; border:0; border-radius:50%;
    background:rgba(6,35,46,.62); color:var(--foam);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    font-size:22px; font-weight:600; font-family:inherit; cursor:pointer;
  }
  .btn:active { background:var(--tide); color:#04222b; }
  #scaleLabel {
    min-width:74px; text-align:center; padding:12px 0; border-radius:999px;
    background:rgba(6,35,46,.62); color:var(--foam); font-size:14px;
    font-variant-numeric:tabular-nums;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
</style>
</head>
<body>

<video id="cam" autoplay playsinline muted></video>

<div id="intro">
  <h1>물고기가 있는 방</h1>
  <p>마커가 필요 없습니다. 카메라를 켜고 휴대폰을 천천히 돌리면 주변에 물고기가 헤엄치고 있습니다.</p>
  <button id="start">카메라 켜기</button>
  <p id="err"></p>
</div>

<div id="hud">
  <button class="btn" id="minus" aria-label="작게">−</button>
  <div id="scaleLabel">100%</div>
  <button class="btn" id="plus" aria-label="크게">+</button>
  <button class="btn" id="reset" aria-label="원래 크기로">↺</button>
</div>

<script>
/* ---------- 유영 ---------- */
AFRAME.registerComponent('swim', {
  schema: {
    radius:{default:2.5}, speed:{default:0.25}, phase:{default:0},
    height:{default:0}, bob:{default:0.3}, wobble:{default:0.1},
    yawOffset:{default:0}
  },
  init: function(){ this.t = 0; },
  tick: function(time, delta){
    if (!delta) return;
    var d = this.data;
    this.t += (delta/1000) * d.speed;
    var a = this.t + d.phase, o = this.el.object3D;
    o.position.set(
      Math.cos(a) * d.radius,
      d.height + Math.sin(a*2) * d.bob,
      Math.sin(a) * d.radius
    );
    o.rotation.set(0, -a + d.yawOffset, Math.sin(a*6) * d.wobble);
  }
});

/* ---------- 크기 ---------- */
var school, scale = 1, MIN = 0.1, MAX = 6;
function applyScale(){
  scale = Math.min(MAX, Math.max(MIN, scale));
  if (school) school.object3D.scale.set(scale, scale, scale);
  document.getElementById('scaleLabel').textContent = Math.round(scale*100) + '%';
}

/* ---------- 카메라 + 자이로 ---------- */
async function startCamera(){
  var stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' } },
    audio: false
  });
  document.getElementById('cam').srcObject = stream;
}

async function askGyro(){
  // iOS 13+ 는 사용자 제스처 안에서 권한을 물어야 합니다
  var DOE = window.DeviceOrientationEvent;
  if (DOE && typeof DOE.requestPermission === 'function') {
    try { await DOE.requestPermission(); } catch (e) { /* 거부해도 화면은 동작 */ }
  }
}

window.addEventListener('DOMContentLoaded', function(){
  school = document.getElementById('school');
  applyScale();

  document.getElementById('plus').onclick  = function(){ scale *= 1.2; applyScale(); };
  document.getElementById('minus').onclick = function(){ scale /= 1.2; applyScale(); };
  document.getElementById('reset').onclick = function(){ scale = 1;    applyScale(); };

  var startDist = 0, startScale = 1;
  function dist(t){ return Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY); }
  document.addEventListener('touchstart', function(e){
    if (e.touches.length === 2){ startDist = dist(e.touches); startScale = scale; }
  }, {passive:true});
  document.addEventListener('touchmove', function(e){
    if (e.touches.length === 2 && startDist > 0){
      e.preventDefault();
      scale = startScale * (dist(e.touches)/startDist);
      applyScale();
    }
  }, {passive:false});
  document.addEventListener('touchend', function(){ startDist = 0; }, {passive:true});

  document.getElementById('start').onclick = async function(){
    var err = document.getElementById('err');
    try {
      await askGyro();
      await startCamera();
      document.getElementById('intro').style.display = 'none';
      document.getElementById('hud').classList.add('on');
    } catch (e) {
      err.style.display = 'block';
      err.textContent = '카메라를 열지 못했습니다. 주소가 https로 시작하는지, 브라우저 설정에서 카메라가 차단돼 있지 않은지 확인해 주세요.';
    }
  };
});
</script>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  renderer="colorManagement: true; antialias: true; alpha: true"
  background="transparent: true">

  <a-assets>
    <a-asset-item id="fish1" src="Fish1.glb"></a-asset-item>
    <a-asset-item id="fish2" src="Fish2.glb"></a-asset-item>
    <a-asset-item id="fish3" src="Fish3.glb"></a-asset-item>
  </a-assets>

  <!-- 사람 눈높이에 카메라, 자이로로 둘러보기 -->
  <a-entity camera position="0 1.6 0"
            look-controls="touchEnabled: false; mouseEnabled: true; magicWindowTrackingEnabled: true"></a-entity>

  <!-- 물고기 무리: 카메라 주위를 돕니다 -->
  <a-entity id="school" position="0 1.6 0">
    <a-entity gltf-model="#fish1" animation-mixer scale="0.1 0.1 0.1"
              swim="radius: 2.5; speed:  0.25; phase: 0;   height:  0.0; bob: 0.30"></a-entity>
    <a-entity gltf-model="#fish2" animation-mixer scale="0.1 0.1 0.1"
              swim="radius: 1.8; speed: -0.35; phase: 2.1; height:  0.6; bob: 0.25"></a-entity>
    <a-entity gltf-model="#fish3" animation-mixer scale="0.1 0.1 0.1"
              swim="radius: 3.4; speed:  0.18; phase: 4.2; height: -0.4; bob: 0.40"></a-entity>
  </a-entity>

  <a-light type="ambient" color="#cfeff5" intensity="0.9"></a-light>
  <a-light type="directional" position="1 3 2" intensity="0.7"></a-light>
</a-scene>

</body>
</html>
